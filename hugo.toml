baseURL = "https://innocuous.org/"
locale = "en-us"
title = "Bulrush Labs"
enableRobotsTXT = true
enableEmoji = true

[params]
  brandLine = "by Richard Tibbetts"
  owner = "Richard Tibbetts"
  eyebrow = "Software · Writing · Ideas"
  tagline1 = "Builder of useful software."
  tagline2 = "Writer of technical things."
  description = "Bulrush Labs is my home for shipping practical tools, exploring systems and developer experience, and sharing what I'm learning along the way."
  email = "richard@bulrushlabs.com"
  # Static HN search link per the redesign design doc — works with no JavaScript.
  hnSearchBase = "https://hn.algolia.com/?query="

  [[params.credentials]]
    icon = "code"
    label = "Software"
    value = "Full-stack"
  [[params.credentials]]
    icon = "pencil"
    label = "Writing"
    value = "Technical"
  [[params.credentials]]
    icon = "leaf"
    label = "Focus"
    value = "Practical"
  [[params.credentials]]
    icon = "pin"
    label = "Based in"
    value = "New England"

[taxonomies]
  category = "categories"
  tag = "tags"

# The old WordPress URLs must keep working: /articles/YYYY/MM/DD/slug/
[permalinks]
  [permalinks.page]
    articles = "/articles/:year/:month/:day/:slug/"
  [permalinks.term]
    categories = "/articles/category/:slug/"
    tags = "/articles/tag/:slug/"

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "algol_nu"

[services.rss]
  limit = 50

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 10

[[menu.main]]
  name = "Articles"
  url = "/articles/"
  weight = 20

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 30

[[menu.main]]
  name = "Notes"
  url = "/notes/"
  weight = 40
