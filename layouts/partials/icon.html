{{- /* Inline stroke icons. Standard UI glyphs, drawn directly rather than
       generated: arrows, checks, mail, github and friends. */ -}}
{{- $n := .name -}}
{{- $c := .class | default "icon" -}}
{{- $s := .size | default 20 -}}
<svg class="{{ $c }}" width="{{ $s }}" height="{{ $s }}" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
     aria-hidden="true" focusable="false">
{{- if eq $n "mail" }}
  <rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3 6.5 9 6 9-6"/>
{{- else if eq $n "arrow-right" }}
  <path d="M4 12h15"/><path d="m13 6 6 6-6 6"/>
{{- else if eq $n "check" }}
  <circle cx="12" cy="12" r="9.25" fill="currentColor" stroke="none"/>
  <path d="m7.8 12.2 2.8 2.8 5.6-5.8" stroke="#fff" stroke-width="2"/>
{{- else if eq $n "terminal" }}
  <path d="m4 7 5 5-5 5"/><path d="M12 17h8"/>
{{- else if eq $n "github" }}
  <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.9a3.4 3.4 0 0 0-.9-2.6c3-.3 6.2-1.5 6.2-6.7A5.2 5.2 0 0 0 19 3.4a4.9 4.9 0 0 0-.1-3.6s-1.1-.3-3.7 1.4a12.7 12.7 0 0 0-6.8 0C5.8-.5 4.7-.2 4.7-.2a4.9 4.9 0 0 0-.1 3.6 5.2 5.2 0 0 0-1.4 3.6c0 5.2 3.2 6.4 6.2 6.7a3.4 3.4 0 0 0-.9 2.6V20" transform="translate(0 4)"/>
{{- else if eq $n "code" }}
  <path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/>
{{- else if eq $n "pencil" }}
  <path d="M4 20h4L19.5 8.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/><path d="m14.5 6.5 3 3"/>
{{- else if eq $n "leaf" }}
  <path d="M4 20c0-8 5-14 16-15 0 11-5 15-11 15a5 5 0 0 1-5-5Z"/><path d="M10 20c1-5 4-8 8-10"/>
{{- else if eq $n "pin" }}
  <path d="M12 21s7-5.4 7-11a7 7 0 1 0-14 0c0 5.6 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/>
{{- else if eq $n "anchor" }}
  <circle cx="12" cy="5" r="2.5"/><path d="M12 7.5V21"/><path d="M5 13a7 7 0 0 0 14 0"/><path d="M8.5 11H15.5"/>
{{- else if eq $n "inbox" }}
  <path d="M3.5 12.5h4l1.5 2.5h6l1.5-2.5h4"/><path d="M4.5 6.5h15l1 6v5h-17v-5Z"/>
{{- else if eq $n "calendar" }}
  <rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3.5v3M16 3.5v3"/>
{{- else if eq $n "folder" }}
  <path d="M3.5 7.5a2 2 0 0 1 2-2H10l2 2.5h6.5a2 2 0 0 1 2 2v7.5a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z"/>
{{- else if eq $n "tasks" }}
  <path d="M4 7.5 6 9.5 9.5 6"/><path d="M4 16.5 6 18.5 9.5 15"/><path d="M13 8h7M13 17h7"/>
{{- else if eq $n "note" }}
  <path d="M6 3.5h9L19.5 8v12.5h-13Z"/><path d="M14.5 3.5V8.5H19.5"/>
{{- else if eq $n "search" }}
  <circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/>
{{- else if eq $n "settings" }}
  <circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/>
{{- else if eq $n "plus" }}
  <path d="M12 5.5v13M5.5 12h13"/>
{{- end }}
</svg>
